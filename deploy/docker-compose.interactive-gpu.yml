name: open-sprite-object-forge

services:
  object-forge:
    build:
      context: ..
      dockerfile: Dockerfile.trellis2.runtime
    image: open-sprite-pipeline:trellis2-ui-cu124
    container_name: open-sprite-object-forge
    init: true
    restart: unless-stopped
    # Run as the host user so nothing written to the bind mounts is root-owned.
    # As root, the API created a fresh root-owned jobs/<id>/ per Forge job and
    # the host worker (which must run outside the container, because Blender
    # cannot run in it) then failed on views_backup — after the job had already
    # reached queued_bake. The documented `docker exec ... chown` only ever
    # fixed directories that already existed, so it had to be re-run between
    # staging and approving every single job.
    #
    # Changing this requires a one-time migration of content the container
    # wrote while it was root; see docs/BAKE_FORGE.md step 3b.
    user: "1000:1000"
    ports:
      - "127.0.0.1:8050:8050"
    environment:
      OPEN_SPRITE_PIPELINE_CONFIG: /app/configs/app.container.yaml
      OPEN_SPRITE_UI_ROOT: /data/runs/ui
      FORGE_ENABLED: "1"
      # Set only if you also pass the same token to the host worker.
      # FORGE_WORKER_TOKEN: ""
      OPEN_SPRITE_SEGMENTER: sam2
      OPEN_SPRITE_SAM2_MODEL: facebook/sam2.1-hiera-tiny
      OPEN_SPRITE_SAM2_DEVICE: cuda:1
      OPEN_SPRITE_SAM2_LOCAL_ONLY: "true"
      OPEN_SPRITE_SEGMENTATION_ALLOW_FALLBACK: "false"
      OPEN_SPRITE_ALLOW_REAL_GENERATION: "true"
      OPEN_SPRITE_GPU_QUEUE_LIMIT: "8"
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      # uid-1000 fix: the image has HOME=/ , so every library that caches
      # under $HOME (triton /.triton, flex_gemm /.flex_gemm, torch
      # extensions ...) tried to write the filesystem root and failed once
      # the container stopped running as root. HOME=/cache (uid-1000-owned,
      # writable) fixes the whole class; HF caches stay pinned explicitly.
      HOME: /cache
      TRITON_HOME: /cache/triton
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      OPENCV_IO_ENABLE_OPENEXR: "1"
      SPARSE_CONV_BACKEND: flex_gemm
      SPARSE_ATTN_BACKEND: flash_attn
      ATTN_BACKEND: flash_attn
      NVIDIA_VISIBLE_DEVICES: "0,1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,video
      CUDA_VISIBLE_DEVICES: "0,1"
    volumes:
      - ../.runs/trellis2-container:/data/runs
      - ../tmp/trellis2-container:/data/tmp
      - ../outputs/trellis2-container:/data/outputs
      - ../.cache/trellis2-container:/cache
    gpus:
      - driver: nvidia
        device_ids:
          - "0"
          - "1"
        capabilities:
          - gpu
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
